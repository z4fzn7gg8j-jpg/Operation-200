name: Apply Operation 20 banner update
on:
  push:
    paths:
      - '.github/workflows/oct8-op20-banner.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use 140 Barbell Strength Banner on Operation 20 home
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          new='''<div class="op20-hero op20-strength-banner" aria-label="Operation 20 · 140 · 3"><img src="assets/140 Barbell Strength Banner.png" alt="20 · 140 · 3 strength banner"></div>'''
          if 'assets/140 Barbell Strength Banner.png' not in s:
              s,n=re.subn(r'<div class="op20-hero"><div class="nums">.*?</div></div>',new,s,count=1,flags=re.S)
              if n!=1: raise SystemExit('Operation 20 hero target not found')
              p.write_text(s)

          css=Path('assets/css/app.css')
          c=css.read_text()
          marker='/* Operation 20 strength banner crop — show only inside cyan border; source image remains unchanged. */'
          block='''

/* Operation 20 strength banner crop — show only inside cyan border; source image remains unchanged. */
.op20-strength-banner{
  position:relative;
  width:100%;
  aspect-ratio:2020 / 569;
  min-height:0 !important;
  padding:0 !important;
  overflow:hidden;
  background:none !important;
  border:0 !important;
  border-radius:0 !important;
}
.op20-strength-banner img{
  position:absolute;
  display:block;
  max-width:none;
  width:101.386%;
  height:auto;
  left:-0.693%;
  top:-5.10%;
  margin:0;
  pointer-events:none;
  user-select:none;
}
'''
          if marker not in c:
              css.write_text(c+block)
      - name: Commit banner update
        run: |
          git config user.name 'ChatGPT Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html assets/css/app.css
          git diff --cached --quiet && exit 0
          git commit -m 'Use 140 Barbell Strength Banner for Operation 20'
          git push